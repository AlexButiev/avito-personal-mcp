name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest

  release-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install package as an end user
        run: python -m pip install --upgrade pip && python -m pip install .

      - name: Verify installed version and console entry points
        run: |
          python -c "import importlib.metadata; assert importlib.metadata.version('avito-personal-mcp') == '0.1.0rc3'"
          python -c "from avito_personal_mcp.server import main; assert callable(main)"
          python -c "from avito_personal_mcp.cli import installed_server_command; assert installed_server_command()"
          command -v avito-personal-mcp
          command -v avito-ai
          avito-ai --help
